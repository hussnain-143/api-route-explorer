<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap');
            .og-title { font-family: 'Inter', sans-serif; font-size: 52px; font-weight: 800; fill: #FFFFFF; letter-spacing: -1.5px; }
            .og-tagline { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 500; fill: #94A3B8; letter-spacing: -0.2px; }
            .og-mono { font-family: 'Fira Code', monospace; font-size: 13px; }
        </style>
        <radialGradient id="og-glow" cx="20%" cy="30%" r="60%">
            <stop offset="0%" stop-color="#10B981" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#0B1220" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <rect width="1200" height="630" fill="#0B1220"/>
    <circle cx="300" cy="200" r="450" fill="url(#og-glow)"/>
    <rect x="2" y="2" width="1196" height="626" rx="20" stroke="#1F2937" stroke-width="3"/>

    <!-- Left Column: Branding -->
    <g transform="translate(80, 100)">
        <rect width="104" height="104" rx="24" fill="#111827" stroke="#1F2937" stroke-width="2"/>
        <g transform="translate(10, 10) scale(0.65)">
            <g stroke-linecap="round" stroke-linejoin="round">
        <!-- Main Route Highway (Emerald into Teal) -->
        <line x1="28" y1="46" x2="64" y2="46" stroke="#10B981" stroke-width="8.5"/>
        <line x1="64" y1="46" x2="92" y2="46" stroke="#14B8A6" stroke-width="8.5"/>
        
        <!-- Directional Navigation Arrow (Teal) -->
        <path d="M 82 32 L 102 46 L 82 60" fill="none" stroke="#14B8A6" stroke-width="8.5"/>
        
        <!-- Node 1: Origin Endpoint (Emerald with high-contrast core) -->
        <circle cx="28" cy="46" r="8" fill="#10B981"/>
        <circle cx="28" cy="46" r="3.5" fill="#FFFFFF"/>
        
        <!-- Node 2: Route Junction (Cyan with deep core) -->
        <circle cx="64" cy="46" r="8" fill="#06B6D4"/>
        <circle cx="64" cy="46" r="3.5" fill="#111827"/>
        
        <!-- Route Branch Stem into Code (Cyan) -->
        <line x1="64" y1="54" x2="64" y2="72" stroke="#06B6D4" stroke-width="5.5"/>
        
        <!-- Integrated Code Motif: </> -->
        <!-- Left bracket < (Emerald) -->
        <path d="M 44 79 L 35 86.5 L 44 94" fill="none" stroke="#10B981" stroke-width="5.5"/>
        <!-- Route Slash / (Cyan) centered at (64, 86.5) -->
        <line x1="57" y1="95" x2="71" y2="78" stroke="#06B6D4" stroke-width="5.5"/>
        <!-- Right bracket > (Teal) -->
        <path d="M 84 79 L 93 86.5 L 84 94" fill="none" stroke="#14B8A6" stroke-width="5.5"/>
    </g>
        </g>

        <!-- Brand Name -->
        <g transform="translate(0, 160)">
            <text y="0">
                <tspan class="og-title">API Route </tspan>
                <tspan class="og-title" fill="#10B981">Explorer</tspan>
            </text>
            <text y="48" class="og-tagline">See every API route. Jump straight to the code.</text>
        </g>

        <!-- Product Details -->
        <g transform="translate(0, 260)">
            <text y="0" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#94A3B8">
                A professional VS Code extension that scans Express &amp; Node.js projects,<br/>
                organizes endpoints in a sidebar tree, and enables instant code navigation.
            </text>

            <g transform="translate(0, 54)">
                <rect x="0" y="0" width="150" height="34" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1"/>
                <text x="75" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#E2E8F0" text-anchor="middle">VS CODE EXTENSION</text>

                <rect x="162" y="0" width="140" height="34" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1"/>
                <text x="232" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#10B981" text-anchor="middle">NODE.JS / EXPRESS</text>

                <rect x="314" y="0" width="130" height="34" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1"/>
                <text x="379" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#06B6D4" text-anchor="middle">OPEN SOURCE</text>
            </g>
        </g>
    </g>

    <!-- Right Column: Visual Mockup Card -->
    <g transform="translate(680, 90)">
        <rect width="440" height="450" rx="16" fill="#111827" stroke="#1F2937" stroke-width="2"/>
        
        <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 424 0 C 432.84 0 440 7.16 440 16 L 440 46 L 0 46 Z" fill="#0C1424"/>
        <circle cx="20" cy="23" r="5" fill="#EF4444"/>
        <circle cx="36" cy="23" r="5" fill="#F59E0B"/>
        <circle cx="52" cy="23" r="5" fill="#10B981"/>
        <text x="80" y="27" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#94A3B8">VS CODE ROUTE EXPLORER</text>

        <!-- Route items list -->
        <g transform="translate(24, 70)">
            <g transform="translate(0, 0)">
                <rect x="0" y="0" width="40" height="20" rx="4" fill="rgba(20, 184, 166, 0.15)" stroke="#14B8A6" stroke-width="1"/>
                <text x="20" y="14" class="og-mono" font-weight="700" fill="#14B8A6" text-anchor="middle">POST</text>
                <text x="50" y="15" class="og-mono" fill="#F8FAFC">/auth/login</text>
            </g>

            <g transform="translate(0, 36)">
                <rect x="0" y="0" width="36" height="20" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1"/>
                <text x="18" y="14" class="og-mono" font-weight="700" fill="#10B981" text-anchor="middle">GET</text>
                <text x="46" y="15" class="og-mono" fill="#F8FAFC">/users</text>
            </g>

            <!-- Active Jump Highlight -->
            <g transform="translate(-8, 70)">
                <rect width="408" height="34" rx="6" fill="#0B1220" stroke="#10B981" stroke-width="2"/>
                <rect x="8" y="7" width="36" height="20" rx="4" fill="rgba(16, 185, 129, 0.25)" stroke="#10B981" stroke-width="1"/>
                <text x="26" y="21" class="og-mono" font-weight="700" fill="#10B981" text-anchor="middle">GET</text>
                <text x="54" y="22" class="og-mono" font-weight="700" fill="#6EE7B7">/users/:id</text>
                <text x="320" y="21" class="og-mono" font-size="11" fill="#06B6D4">JUMP ➔</text>
            </g>

            <g transform="translate(0, 118)">
                <rect x="0" y="0" width="40" height="20" rx="4" fill="rgba(20, 184, 166, 0.15)" stroke="#14B8A6" stroke-width="1"/>
                <text x="20" y="14" class="og-mono" font-weight="700" fill="#14B8A6" text-anchor="middle">POST</text>
                <text x="50" y="15" class="og-mono" fill="#F8FAFC">/users</text>
            </g>

            <g transform="translate(0, 154)">
                <rect x="0" y="0" width="48" height="20" rx="4" fill="rgba(239, 68, 68, 0.15)" stroke="#EF4444" stroke-width="1"/>
                <text x="24" y="14" class="og-mono" font-weight="700" fill="#EF4444" text-anchor="middle">DEL</text>
                <text x="58" y="15" class="og-mono" fill="#F8FAFC">/users/:id</text>
            </g>
        </g>

        <!-- Code Jump box -->
        <g transform="translate(24, 270)">
            <rect width="392" height="140" rx="8" fill="#0B1220" stroke="#1F2937" stroke-width="1"/>
            <text x="16" y="26" class="og-mono" font-size="11" fill="#64748B">// controllers/users.ts:24</text>
            <text x="16" y="52" class="og-mono" font-size="11" fill="#F43F5E">export const <tspan fill="#06B6D4">getUserById</tspan> =</text>
            <text x="16" y="74" class="og-mono" font-size="11" fill="#E2E8F0">  async (req: Request, res: Response) =&gt; {</text>
            <text x="16" y="96" class="og-mono" font-size="11" fill="#10B981">    const user = await svc.find(req.params.id);</text>
            <text x="16" y="118" class="og-mono" font-size="11" fill="#E2E8F0">  };</text>
        </g>
    </g>
</svg>