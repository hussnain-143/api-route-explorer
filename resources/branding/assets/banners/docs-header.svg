<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" fill="none">
    <rect width="1200" height="260" rx="16" fill="#0B1220"/>
    <rect x="1" y="1" width="1198" height="258" rx="15" stroke="#1F2937" stroke-width="2"/>
    
    <defs>
        <pattern id="doc-grid" width="30" height="30" patternUnits="userSpaceOnUse">
            <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#111827" stroke-width="1"/>
        </pattern>
    </defs>
    <rect width="1200" height="260" fill="url(#doc-grid)" opacity="0.6"/>

    <g transform="translate(64, 48)">
        <rect width="96" height="96" rx="22" fill="#111827" stroke="#1F2937" stroke-width="1.5"/>
        <g transform="translate(8, 8) scale(0.625)">
            <g stroke-linecap="round" stroke-linejoin="round">
        <!-- Main Route Highway (Emerald into Teal) -->
        <line x1="28" y1="46" x2="64" y2="46" stroke="#10B981" stroke-width="8.5"/>
        <line x1="64" y1="46" x2="92" y2="46" stroke="#14B8A6" stroke-width="8.5"/>
        
        <!-- Directional Navigation Arrow (Teal) -->
        <path d="M 82 32 L 102 46 L 82 60" fill="none" stroke="#14B8A6" stroke-width="8.5"/>
        
        <!-- Node 1: Origin Endpoint (Emerald with high-contrast core) -->
        <circle cx="28" cy="46" r="8" fill="#10B981"/>
        <circle cx="28" cy="46" r="3.5" fill="#FFFFFF"/>
        
        <!-- Node 2: Route Junction (Cyan with deep core) -->
        <circle cx="64" cy="46" r="8" fill="#06B6D4"/>
        <circle cx="64" cy="46" r="3.5" fill="#111827"/>
        
        <!-- Route Branch Stem into Code (Cyan) -->
        <line x1="64" y1="54" x2="64" y2="72" stroke="#06B6D4" stroke-width="5.5"/>
        
        <!-- Integrated Code Motif: </> -->
        <!-- Left bracket < (Emerald) -->
        <path d="M 44 79 L 35 86.5 L 44 94" fill="none" stroke="#10B981" stroke-width="5.5"/>
        <!-- Route Slash / (Cyan) centered at (64, 86.5) -->
        <line x1="57" y1="95" x2="71" y2="78" stroke="#06B6D4" stroke-width="5.5"/>
        <!-- Right bracket > (Teal) -->
        <path d="M 84 79 L 93 86.5 L 84 94" fill="none" stroke="#14B8A6" stroke-width="5.5"/>
    </g>
        </g>
    </g>

    <g transform="translate(184, 84)">
        <text y="0">
            <tspan font-family="'Inter', sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" letter-spacing="-0.8px">API Route </tspan>
            <tspan font-family="'Inter', sans-serif" font-size="36" font-weight="600" fill="#10B981" letter-spacing="-0.8px">Explorer</tspan>
            <tspan font-family="'Inter', sans-serif" font-size="18" font-weight="600" fill="#06B6D4">  DOCS</tspan>
        </text>
        <text y="36" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#94A3B8">See every API route. Jump straight to the code.</text>
        
        <g transform="translate(0, 58)">
            <rect x="0" y="0" width="150" height="26" rx="13" fill="#111827" stroke="#1F2937" stroke-width="1"/>
            <text x="75" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#CBD5E1" text-anchor="middle">Node.js &amp; Express AST</text>

            <rect x="160" y="0" width="140" height="26" rx="13" fill="#111827" stroke="#1F2937" stroke-width="1"/>
            <text x="230" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#CBD5E1" text-anchor="middle">Instant Code Jump</text>

            <rect x="310" y="0" width="130" height="26" rx="13" fill="#111827" stroke="#1F2937" stroke-width="1"/>
            <text x="375" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#10B981" text-anchor="middle">Zero Config</text>
        </g>
    </g>
</svg>