<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360" fill="none">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
            .brand-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: 800; fill: #FFFFFF; letter-spacing: -0.5px; }
            .brand-suffix { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: 600; fill: #10B981; letter-spacing: -0.5px; }
            .brand-tagline { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 500; fill: #94A3B8; letter-spacing: 0.2px; }
        </style>
    </defs>

    <!-- Center Emblem Badge -->
    <g transform="translate(96, 32)">
        <rect width="128" height="128" rx="28" fill="#0B1220"/>
        <rect x="1" y="1" width="126" height="126" rx="27" stroke="#1F2937" stroke-width="2" fill="none"/>
        <g stroke-linecap="round" stroke-linejoin="round">
        <!-- Main Route Highway (Emerald into Teal) -->
        <line x1="28" y1="46" x2="64" y2="46" stroke="#10B981" stroke-width="8.5"/>
        <line x1="64" y1="46" x2="92" y2="46" stroke="#14B8A6" stroke-width="8.5"/>
        
        <!-- Directional Navigation Arrow (Teal) -->
        <path d="M 82 32 L 102 46 L 82 60" fill="none" stroke="#14B8A6" stroke-width="8.5"/>
        
        <!-- Node 1: Origin Endpoint (Emerald with high-contrast core) -->
        <circle cx="28" cy="46" r="8" fill="#10B981"/>
        <circle cx="28" cy="46" r="3.5" fill="#FFFFFF"/>
        
        <!-- Node 2: Route Junction (Cyan with deep core) -->
        <circle cx="64" cy="46" r="8" fill="#06B6D4"/>
        <circle cx="64" cy="46" r="3.5" fill="#0B1220"/>
        
        <!-- Route Branch Stem into Code (Cyan) -->
        <line x1="64" y1="54" x2="64" y2="72" stroke="#06B6D4" stroke-width="5.5"/>
        
        <!-- Integrated Code Motif: </> -->
        <!-- Left bracket < (Emerald) -->
        <path d="M 44 79 L 35 86.5 L 44 94" fill="none" stroke="#10B981" stroke-width="5.5"/>
        <!-- Route Slash / (Cyan) centered at (64, 86.5) -->
        <line x1="57" y1="95" x2="71" y2="78" stroke="#06B6D4" stroke-width="5.5"/>
        <!-- Right bracket > (Teal) -->
        <path d="M 84 79 L 93 86.5 L 84 94" fill="none" stroke="#14B8A6" stroke-width="5.5"/>
    </g>
    </g>

    <!-- Wordmark & Tagline -->
    <g transform="translate(160, 220)" text-anchor="middle">
        <text y="0">
            <tspan class="brand-title">API Route </tspan>
            <tspan class="brand-suffix">Explorer</tspan>
        </text>
        <text y="32" class="brand-tagline">See every API route. Jump straight to the code.</text>
    </g>

    <!-- Method Badges Micro Deco -->
    <g transform="translate(65, 290)">
        <rect x="0" y="0" width="36" height="20" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1"/>
        <text x="18" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle">GET</text>
        
        <rect x="42" y="0" width="42" height="20" rx="4" fill="rgba(20, 184, 166, 0.15)" stroke="#14B8A6" stroke-width="1"/>
        <text x="63" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#14B8A6" text-anchor="middle">POST</text>
        
        <rect x="90" y="0" width="36" height="20" rx="4" fill="rgba(245, 158, 11, 0.15)" stroke="#F59E0B" stroke-width="1"/>
        <text x="108" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#F59E0B" text-anchor="middle">PUT</text>
        
        <rect x="132" y="0" width="56" height="20" rx="4" fill="rgba(239, 68, 68, 0.15)" stroke="#EF4444" stroke-width="1"/>
        <text x="160" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#EF4444" text-anchor="middle">DELETE</text>
    </g>
</svg>